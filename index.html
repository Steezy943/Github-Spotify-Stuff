<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobra Universal Music Browser</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --bg-dark: #121212;
            --card-surface: #181818;
            --text-main: #FFFFFF;
            --text-secondary: #B3B3B3;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 35px;
            font-size: 1rem;
        }

        #search-container {
            width: 100%;
            max-width: 650px;
            margin-bottom: 40px;
        }

        #search-box {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background-color: #242424;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: box-shadow 0.2s ease;
        }

        #search-box:focus {
            box-shadow: 0 0 0 2px var(--spotify-green);
        }

        #results {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .track-card {
            background-color: var(--card-surface);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .track-details h3 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
        }

        .track-details p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        iframe {
            border: none;
            border-radius: 12px;
            background-color: transparent;
        }

        .status-msg {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Cobra Music Browser</h1>
    <div class="subtitle">Search any creator or track across the absolute global catalog</div>

    <div id="search-container">
        <input type="text" id="search-box" placeholder="Search tracks, artists, or niche creators... (Press Enter)">
    </div>

    <div id="results">
        <p class="status-msg">Type above and press enter to stream tracks instantly.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
